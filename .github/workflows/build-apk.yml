name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Install Capacitor & Initialize Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/UniSolve.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniSolve-APK
          path: release-apk/UniSolve.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "UniSolve Android App v1.0.0"
          body: |
            ## 📱 UniSolve - Android APK Download
            Direct APK build of the UniSolve University Student Issue Management System.
            
            ### Installation Instructions:
            1. Download **UniSolve.apk** below on your Android mobile device.
            2. Tap the file in your notification bar or Downloads folder to install.
            3. If Android shows a security prompt, tap **Settings** and enable **"Allow from this source"** (standard for direct APK installs).
            4. Open UniSolve and sign in with your student or admin credentials!
          files: release-apk/UniSolve.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
